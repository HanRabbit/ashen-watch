<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>灰烬守夜</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%231b1e22%27/%3E%3Ccircle cx=%2716%27 cy=%2718%27 r=%277%27 fill=%27%23f0a84a%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!-- 物品图标（UI-02）：单色线描，统一 2 px 线宽（32 视框），造型取自 concept/04 的锻铁与灯笼。 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <!-- 木料：三根叠放的原木端面 -->
    <symbol id="i-wood" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="22" r="6"/><circle cx="22" cy="22" r="6"/><circle cx="16" cy="10.5" r="6"/><circle cx="10" cy="22" r="2.2"/><circle cx="22" cy="22" r="2.2"/><circle cx="16" cy="10.5" r="2.2"/></g></symbol>
    <!-- 铁件：锻铁砧 -->
    <symbol id="i-iron" viewBox="0 0 32 32"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 10c3-1 5-2 8-2h16v4h-5c0 3-2 4-4 5v5h5v3H9v-3h5v-5c-2-1-4-2-4-5H7c-2 0-3-1-3-2z"/></symbol>
    <!-- 灯油：concept/04 的圆肚油瓶，木塞 + 油面线 -->
    <symbol id="i-oil" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12.5 4V2.5h7V4"/><path d="M13 4h6v4l4 5c1.5 2 2 3.5 2 5.5a9 8.5 0 0 1-18 0c0-2 .5-3.5 2-5.5l4-5z"/><path d="M8 19h16" stroke-linecap="round"/></g></symbol>
    <!-- 热食：铁碗 + 两缕 S 形蒸汽 -->
    <symbol id="i-meal" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16h22c0 6-4.5 10-11 10S5 22 5 16z"/><path d="M12 12c-1.5-2 1.5-3 0-6M20 12c-1.5-2 1.5-3 0-6"/></g></symbol>
    <!-- 提灯：concept/04 的六角灯笼，吊环 + 尖顶 + 竖棂 + 烛焰 -->
    <symbol id="i-lantern" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="16" cy="4.5" r="2.5"/><path d="M8 13l8-5 8 5z"/><path d="M7 13h18" stroke-linecap="round"/><path d="M10 13v11h12V13"/><path d="M13.5 13v11M18.5 13v11"/><path d="M9 24h14v2.5H9z"/><path d="M16 21.5c-2-2.2-.4-3.4 0-5.5 1.6 2.1 2 3.3 0 5.5z" fill="currentColor" stroke="none"/></g></symbol>
    <!-- 钟舌：concept/04 左下的吊环 + 锥柄 + 铁球 -->
    <symbol id="i-clapper" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="16" cy="5.5" r="3"/><path d="M13.5 9.5h5v3h-5z"/><path d="M14.5 12.5c-.4 2.6-1.2 4-2 6.5M17.5 12.5c.4 2.6 1.2 4 2 6.5" stroke-linecap="round"/><circle cx="16" cy="23" r="5" fill="currentColor" stroke="none"/></g></symbol>
    <!-- 时段图标：阴天圆盘 / 月牙 / 地平线半日 -->
    <symbol id="i-phase-day" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="16" cy="12" r="6"/><path d="M6 22h20M9 26h14"/></g></symbol>
    <symbol id="i-phase-night" viewBox="0 0 32 32"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M28 17.05A12 12 0 1 1 14.95 4 9.33 9.33 0 0 0 28 17.05z"/></symbol>
    <symbol id="i-phase-dawn" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 20a7 7 0 0 1 14 0"/><path d="M4 20h24M16 7v3M7.5 11.5l2 2M24.5 11.5l-2 2"/></g></symbol>
  </svg>

  <canvas id="game" tabindex="-1"></canvas>

  <div id="fx-threat" class="fx"></div>
  <div id="fx-cold" class="fx"></div>
  <div id="fx-hurt" class="fx"></div>

  <div id="hud" hidden>
    <div class="hud-tl">
      <div id="hud-phase" class="chip"></div>
      <div id="hud-goal" class="goal"></div>
    </div>
    <div id="hud-toasts" class="toasts" aria-live="polite"></div>
    <div id="crosshair"></div>
    <div id="hud-guide" hidden aria-hidden="true"></div>
    <div id="hud-prompt" class="prompt" hidden></div>
    <div id="hud-subs" class="subs" aria-live="assertive"></div>
    <div class="hud-bl">
      <div class="bar" id="bar-hp"><span class="bar-name">生命</span><div class="bar-track"><i></i></div><span class="bar-val"></span></div>
      <div class="bar" id="bar-cold"><span class="bar-name">寒意</span><div class="bar-track"><i></i></div><span class="bar-val"></span></div>
      <div class="bar" id="bar-oil"><span class="bar-name">灯油</span><div class="bar-track"><i></i></div><span class="bar-val"></span></div>
    </div>
    <div class="hud-br" id="hud-inv"></div>
    <div id="hud-mousehint" class="mousehint" hidden></div>
  </div>

  <div id="overlay" hidden></div>
  <div id="debug" hidden></div>

  <!-- 加载页：与标题同一语言（深石底 + 衬线标题 + 细线琥珀进度）。贴图就绪后由 ui/boot.ts 淡出。 -->
  <div id="boot" aria-hidden="true">
    <div class="boot-mark">
      <svg class="boot-lantern"><use href="#i-lantern"/></svg>
      <h1>灰烬守夜</h1>
      <p class="boot-sub">ASHEN WATCH</p>
      <div class="boot-line"><i></i></div>
      <p class="boot-note">正在点亮提灯… <span class="boot-pct">0%</span></p>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
  <script type="module" src="./src/ui/boot.ts"></script>
</body>
</html>
